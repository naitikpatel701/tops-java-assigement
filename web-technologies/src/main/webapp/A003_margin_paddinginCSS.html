<!DOCTYPE html>
<html>
<head>
    <title>Margin and Padding Demo</title>

    <style>
        /* Box with margin */
        .margin-box {
            background-color: lightblue;
            margin: 40px; /* space outside */
            border: 2px solid black;
        }

        /* Box with padding */
        .padding-box {
            background-color: lightgreen;
            padding: 30px; /* space inside */
            border: 2px solid black;
        }

        /* Different values */
        .different-box {
            background-color: lightcoral;
            margin: 20px 50px;   /* top-bottom 20px, left-right 50px */
            padding: 10px 40px;  /* top-bottom 10px, left-right 40px */
            border: 2px solid black;
        }
    </style>
</head>

<body>

<h2>Margin Example</h2>
<div class="margin-box">
    This box has margin (space outside the box).
</div>

<h2>Padding Example</h2>
<div class="padding-box">
    This box has padding (space inside the box).
</div>

<h2>Different Margin & Padding</h2>
<div class="different-box">
    This box shows different margin and padding values.
</div>

</body>
</html>
