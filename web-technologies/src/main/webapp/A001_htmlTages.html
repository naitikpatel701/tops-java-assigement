<!DOCTYPE html>
<html>
<head>
    <title>Simple Webpage</title>
</head>

<body>

<!-- Navigation -->
<a href="#home">Home</a> |
<a href="#form">Form</a> |
<a href="#table">Table</a> |
<a href="#list">List</a>

<hr>

<!-- Home -->
<h2 id="home">Home</h2>
<p>Welcome to simple webpage</p>

<img src="https://picsum.photos/200/300" alt="Sample Image">

<hr>

<!-- Form -->
<h2 id="form">Form</h2>

<form>
    Name: <input type="text"><br><br>
    Email: <input type="email"><br><br>
    Message: <br>
    <textarea></textarea><br><br>
    <button type="submit">Submit</button>
</form>

<hr>

<!-- Table -->
<h2 id="table">Table</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
    </tr>
    <tr>
        <td>1</td>
        <td>Naitik</td>
        <td>naitik@gmail.com</td>
    </tr>
    <tr>
        <td>2</td>
        <td>Rahul</td>
        <td>rahul@gmail.com</td>
    </tr>
</table>

<hr>

<!-- Lists -->
<h2 id="list">Lists</h2>

<h3>Unordered List</h3>
<ul>
    <li>Reading</li>
    <li>Coding</li>
    <li>Gaming</li>
</ul>

<h3>Ordered List</h3>
<ol>
    <li>Wake up</li>
    <li>Study</li>
    <li>Exercise</li>
</ol>

</body>
</html>
