<!DOCTYPE html>
<html>
<head>
    <title>ID and Class Example</title>

    <style>
        /* ID styling (unique) */
        #special {
            color: red;
            font-size: 24px;
            text-align: center;
        }

        /* Class styling (multiple elements) */
        .common {
            color: blue;
            background-color: lightgray;
            padding: 10px;
        }
    </style>
</head>

<body>

<!-- ID Example -->
<h2 id="special">This is styled using ID</h2>

<hr>

<!-- Class Example -->
<p class="common">This is paragraph 1 using class</p>
<p class="common">This is paragraph 2 using class</p>
<p class="common">This is paragraph 3 using class</p>

</body>
</html>
