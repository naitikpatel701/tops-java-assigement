<!DOCTYPE html>
<html>
<head>
    <title>CSS Types Example</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="CSStypes.css">
</head>

<body>

<!-- Inline CSS -->
<h1 style="color: red; text-align: center;">
    This is Inline CSS
</h1>

<!-- Internal CSS applied -->
<h2>This is Internal CSS</h2>

<!-- External CSS applied -->
<p>This is External CSS</p>

</body>
</html>
